buildscript {
    repositories {
        mavenCentral()
        maven { url = 'https://maven.minecraftforge.net/' }
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'

group = 'top.luotiany1'
version = '0.2.0+1.12.2'
archivesBaseName = 'GalVoice-Forge'
sourceCompatibility = targetCompatibility = '1.8'

def masterGalPath = findProperty('masterGalJar')
def masterGalJar = masterGalPath == null ? null : file(masterGalPath)

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'
    runs {
        client { workingDirectory project.file('run') }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'
    if (masterGalJar != null) {
        compileOnly files(masterGalJar)
        runtimeOnly files(masterGalJar)
    }
}

sourceSets.main.java.srcDirs '../common/src/main/java', '../client-common/src/main/java'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

compileJava.doFirst {
    if (masterGalJar == null || !masterGalJar.isFile()) {
        throw new GradleException('Supply -PmasterGalJar with the ForgeMaster development JAR for Minecraft 1.12.2.')
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('mcmod.info') {
        expand(version: project.version)
    }
}

jar.finalizedBy 'reobfJar'
